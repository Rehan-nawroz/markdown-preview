<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Markform local editing loop</title>
  <desc id="desc">A diagram showing a local Markdown file feeding a browser editor, which produces a sanitized preview, with no server involved.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <marker id="arrow-cream" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#F3E4C9"/>
    </marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#34D399"/>
    </marker>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101010"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="620" fill="#080808"/>
  <rect width="1200" height="620" fill="url(#grid)" opacity="0.7"/>

  <text x="44" y="52" fill="#F3E4C9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3">MARKFORM / LOCAL EDITING LOOP</text>
  <text x="1156" y="52" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="end">FIG. 01</text>
  <line x1="44" y1="72" x2="1156" y2="72" stroke="#222222"/>

  <rect x="44" y="100" width="1112" height="424" rx="18" fill="none" stroke="#2A2A2A" stroke-dasharray="6 8"/>
  <text x="64" y="126" fill="#525252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2">BROWSER SANDBOX / NO NETWORK REQUIRED</text>

  <!-- Local file -->
  <g>
    <rect x="96" y="188" width="248" height="248" rx="14" fill="url(#fade)" stroke="#333333"/>
    <rect x="120" y="216" width="38" height="46" rx="5" fill="#0A0A0A" stroke="#F3E4C9" stroke-width="1.5"/>
    <path d="M128 230h22M128 238h22M128 246h14" stroke="#F3E4C9" stroke-width="1.6" stroke-linecap="round"/>
    <text x="172" y="232" fill="#F3E4C9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5">LOCAL FILE</text>
    <text x="120" y="292" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="600">notes.md</text>
    <text x="120" y="316" fill="#8E8E93" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">UTF-8 · LF · 4.2 KB</text>
    <line x1="120" y1="336" x2="320" y2="336" stroke="#262626"/>
    <text x="120" y="360" fill="#A3A3A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10"># Project notes</text>
    <text x="120" y="380" fill="#A3A3A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">- [x] write</text>
    <text x="120" y="400" fill="#A3A3A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">- [ ] preview</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="352" y1="312" x2="430" y2="312" stroke="#F3E4C9" stroke-width="1.4" marker-end="url(#arrow-cream)"/>
  <text x="391" y="300" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" text-anchor="middle">read</text>

  <!-- Editor -->
  <g>
    <rect x="438" y="150" width="324" height="324" rx="14" fill="#0A0A0A" stroke="#2F3A44"/>
    <rect x="438" y="150" width="324" height="38" rx="14" fill="#0D1117"/>
    <rect x="438" y="176" width="324" height="12" fill="#0D1117"/>
    <circle cx="462" cy="169" r="4" fill="#EF4444"/>
    <circle cx="476" cy="169" r="4" fill="#F59E0B"/>
    <circle cx="490" cy="169" r="4" fill="#10B981"/>
    <text x="744" y="173" fill="#525252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" text-anchor="end">editor.tsx</text>
    <text x="466" y="216" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11"># Project notes</text>
    <text x="466" y="240" fill="#C084FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">&gt; local-first</text>
    <text x="466" y="264" fill="#A3A3A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">- [x] write</text>
    <text x="466" y="288" fill="#A3A3A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">- [ ] preview</text>
    <text x="466" y="326" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">```js</text>
    <rect x="466" y="338" width="268" height="66" rx="6" fill="#121212" stroke="#242424"/>
    <text x="480" y="360" fill="#C084FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">const</text>
    <text x="516" y="360" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">source</text>
    <text x="562" y="360" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">=</text>
    <text x="574" y="360" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">text</text>
    <text x="480" y="382" fill="#C084FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">render</text>
    <text x="480" y="394" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">// sanitize boundary</text>
    <text x="466" y="432" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">```</text>
    <rect x="438" y="150" width="4" height="324" rx="2" fill="#38BDF8" opacity="0.55"/>
  </g>

  <!-- Arrow 2 -->
  <line x1="770" y1="312" x2="850" y2="312" stroke="#34D399" stroke-width="1.4" marker-end="url(#arrow-green)"/>
  <text x="810" y="300" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" text-anchor="middle">sanitize</text>

  <!-- Preview -->
  <g>
    <rect x="858" y="188" width="250" height="248" rx="14" fill="url(#fade)" stroke="#2B3A33"/>
    <text x="882" y="222" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5">SANITIZED PREVIEW</text>
    <text x="882" y="262" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="600">Project notes</text>
    <line x1="882" y1="276" x2="1084" y2="276" stroke="#262626"/>
    <text x="882" y="300" fill="#A3A3A3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">A local-first editing loop.</text>
    <rect x="882" y="314" width="200" height="26" rx="4" fill="#121212" stroke="#242424"/>
    <text x="892" y="331" fill="#F3E4C9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">renderMarkdown(source)</text>
    <rect x="882" y="352" width="200" height="54" rx="6" fill="#0D0D0D" stroke="#222222"/>
    <circle cx="896" cy="368" r="4" fill="#3F3F46"/>
    <text x="908" y="372" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">preview.html</text>
    <text x="892" y="392" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">✓ no upload</text>
    <text x="882" y="424" fill="#525252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">zero network requests</text>
    <rect x="858" y="188" width="4" height="248" rx="2" fill="#34D399" opacity="0.55"/>
  </g>

  <!-- Save loop -->
  <path d="M983 436v34H228v-34" fill="none" stroke="#F3E4C9" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow-cream)"/>
  <rect x="486" y="458" width="240" height="28" rx="14" fill="#0A0A0A" stroke="#333333"/>
  <text x="606" y="476" fill="#F3E4C9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" text-anchor="middle">SAVE BACK / DOWNLOAD COPY</text>

  <line x1="44" y1="556" x2="1156" y2="556" stroke="#1F1F1F"/>
  <text x="44" y="584" fill="#525252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">NO SERVER</text>
  <text x="160" y="584" fill="#2A2A2A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">/</text>
  <text x="178" y="584" fill="#525252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">NO UPLOAD</text>
  <text x="292" y="584" fill="#2A2A2A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">/</text>
  <text x="310" y="584" fill="#525252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">NO ACCOUNT</text>
  <text x="1156" y="584" fill="#F3E4C9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="end">MARKFORM v1.0</text>
</svg>
